# Netlify: painel em /painel e vitrine pública na raiz (https://<site>.netlify.app/<loja>).
# A API roda no Render; o Netlify encaminha /api para lá, então painel e API ficam no mesmo endereço
# (o cookie de login continua funcionando com SameSite=Strict).
# Defina no Netlify a variável API_URL com o endereço do Render (ex.: https://sistema-vendas-api.onrender.com).
[build]
  base = "frontend"
  publish = "publicar"
  command = "bash netlify-build.sh"

[build.environment]
  NODE_VERSION = "24"
