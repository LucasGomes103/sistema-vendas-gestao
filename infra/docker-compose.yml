# Banco local para desenvolvimento. Uso: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:18
    container_name: sistema-vendas-postgres
    environment:
      POSTGRES_DB: sistema_vendas
      POSTGRES_USER: sistema
      POSTGRES_PASSWORD: sistema_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistema -d sistema_vendas"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
