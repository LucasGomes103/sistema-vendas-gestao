# Render Blueprint: API (.NET) + ponte do WhatsApp (Node) num serviço só, no plano grátis.
# Os segredos (sync: false) são digitados no painel do Render.
services:
  - type: web
    name: sistema-vendas-api
    runtime: docker
    plan: free
    # Mesma região do banco no Supabase (East US - North Virginia), para as consultas serem rápidas.
    region: virginia
    # Contexto = raiz do repositório (a imagem junta backend/ e whatsapp-local/).
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    # Só recompila quando muda algo da API ou da ponte (mudança no front fica com o Cloudflare Pages).
    buildFilter:
      paths:
        - backend/**
        - whatsapp-local/**
        - infra/render/**
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: Banco__MigrarAoIniciar
        value: "true"
      # Connection string do Supabase (pooler, modo sessão), no formato do Npgsql:
      # Host=...pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.xxxx;Password=...;SSL Mode=Require
      - key: ConnectionStrings__Banco
        sync: false
      # Endereço público do Cloudflare Pages (ex.: https://ecsfish.pages.dev): usado no link do catálogo que o robô envia
      - key: Vitrine__UrlBase
        sync: false
      - key: IA__Gemini__ApiKey
        sync: false
      # Respostas da IA por loja por mês (padrão 1000; 0 = sem limite). Cada loja pode ter o seu na tela Lojas
      - key: IA__LimiteRespostasMes
        value: "1000"
      # Botão "Conectar Mercado Pago" (OAuth): aplicação do Mercado Pago da PLATAFORMA (Client ID e Client Secret).
      # Na aplicação, cadastre a URL de redirecionamento https://sistema-vendas-gestao.pages.dev/api/v1/mercadopago/oauth/retorno
      - key: MercadoPago__OAuth__ClientId
        sync: false
      - key: MercadoPago__OAuth__ClientSecret
        sync: false
      # Assinatura secreta dos Webhooks da aplicação da plataforma (avisos das lojas conectadas pelo botão)
      - key: MercadoPago__OAuth__WebhookSecret
        sync: false
      # Botão "Conectar WhatsApp" (Embedded Signup): App ID do app da plataforma na Meta e o Configuration ID do
      # Facebook Login for Business. Usa também WhatsApp__AppSecret (o mesmo que confere os webhooks)
      - key: WhatsApp__EmbeddedSignup__AppId
        sync: false
      - key: WhatsApp__EmbeddedSignup__ConfigId
        sync: false
      # Segredo do app da Meta (confere a assinatura dos webhooks) e o texto de verificação do webhook
      - key: WhatsApp__AppSecret
        sync: false
      - key: WhatsApp__VerifyToken
        sync: false
      # Chave que cifra as credenciais de cada loja (openssl rand -base64 32). Guarde uma cópia: perder = recadastrar
      - key: Plataforma__ChaveMestra
        sync: false
      # E-mail de login de quem administra todas as lojas (Lojas da plataforma)
      - key: Plataforma__Admins
        sync: false
      # E-mail do cadastro de loja (Gmail: smtp.gmail.com, 587, seu Gmail e uma senha de app)
      - key: Email__Smtp__Host
        sync: false
      - key: Email__Smtp__Usuario
        sync: false
      - key: Email__Smtp__Senha
        sync: false
      # Cartão pelo Mercado Pago (opcional): sem o token, só Pix. Ver docs/funcionalidades.md
      - key: MercadoPago__AccessToken
        sync: false
      - key: MercadoPago__WebhookSecret
        sync: false
      - key: MercadoPago__ModoTeste
        value: "true"
      - key: WhatsApp__Provedor
        value: Local
      - key: WhatsApp__Local__Segredo
        sync: false
      - key: WhatsApp__Local__LojaSlug
        sync: false
      # Só usados na primeira subida, para criar a loja e o seu usuário (depois pode apagar a senha)
      - key: PrimeiraLoja__Nome
        sync: false
      - key: PrimeiraLoja__Slug
        sync: false
      - key: PrimeiraLoja__DonoNome
        sync: false
      - key: PrimeiraLoja__DonoEmail
        sync: false
      - key: PrimeiraLoja__DonoSenha
        sync: false
